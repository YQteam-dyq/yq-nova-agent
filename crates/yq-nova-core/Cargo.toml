[package]
name    = "yq-nova-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "yq_nova_core"
path = "src/lib.rs"

[dependencies]
# async
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# storage
sqlx = { workspace = true }

# serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_with = { workspace = true }

# utilities
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
arc-swap = { workspace = true }

# HTTP client (for embedding providers)
reqwest = { workspace = true }
http = { workspace = true }

# tracing / logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# optional: local ONNX embeddings (FastEmbed)
fastembed = { workspace = true, optional = true }
# optional: HNSW vector index (sqlite-vec)
sqlite-vec = { workspace = true, optional = true }
# optional: OpenTelemetry observability
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
default = []
# Local ONNX inference (FastEmbed); when enabled, `embedding.fastembed_local` can load a real model.
fastembed = ["dep:fastembed"]
# HNSW vector index backend based on sqlite-vec, faster than a linear scan.
sqlite-vec = ["dep:sqlite-vec"]
# OpenTelemetry observability export (tracing -> OTLP).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "perf"
harness = false
