[workspace]
resolver = "2"
members = [
    "crates/yq-nova-core",
    "crates/yq-nova-server",
    "crates/yq-nova-sdk",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.75"
license     = "BSL-1.1"
authors     = ["yq-nova contributors"]
repository  = "https://github.com/YQteam-dyq/yq-nova-agent"
homepage    = "https://github.com/YQteam-dyq/yq-nova-agent"
description = "Lightweight, single-file Agent memory & state layer (semantic search + graph)"

[workspace.dependencies]
# ---- async runtime ----
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# ---- HTTP server / client ----
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "cors", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "multipart"] }
http = "1.1"
http-body-util = "0.1"

# ---- storage ----
# NOTE: sqlx offline mode is toggled by env var `SQLX_OFFLINE=true` + a
# `sqlx-data.json` file (generated by `cargo sqlx prepare`), NOT a cargo
# feature flag; see https://github.com/launchbadge/sqlx/blob/main/sqlx-cli/README.md
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }
sqlx-core = "0.7"

# ---- serialization ----
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde_with = "3.12"

# ---- utilities ----
uuid = { version = "1.10", features = ["v4", "serde", "fast-rng"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
figment = { version = "0.10", features = ["env", "toml"] }
arc-swap = "1.7"

# ---- logging / tracing ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
    "time",
    "registry",
    "tracing-log",
    "ansi",
] }
tracing-appender = "0.2"
# opentelemetry_api = "0.27"   # v0.4+: add here per-crate as optional dep

# ---- embeddings (optional) ----
# fastembed = "2"   # enable per-crate via feature gate

# ---- testing ----
# (tests only, use dev-dependencies in each crate)

[workspace.metadata]
docs-rs-meta = "stable"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
