name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SQLX_OFLINE: "true"

jobs:
  build-and-test:
    name: Build + Test + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "yq-nova-ci"
          cache-on-failure: true

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Verify formatting
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Unit tests
        run: cargo test --workspace --locked -- --nocapture

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "yq-vona-publish"

      - name: Publish yq-nova-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p yq-nova-core --locked

      - name: Publish yq-nova-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p yq-nova-sdk --locked

      - name: Publish yq-nova-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p yq-nova-server --locked

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # 仅手动 release 或手动触发时执行（正常 push/PR 不运行）
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "yq-nova-release"

      - name: Build release binary
        run: cargo build --release -p yq-nova-server --bin yq-nova --locked

      - name: Upload binary to GitHub Releases
        # 仅 tag 时上传二进制到 Release，workflow_dispatch 时跳过
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/yq-nova
          generate_release_notes: true
