name: clippy-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chore/rustfmt
        uses: actions/checkout@v4
        with:
          ref: chore/rustfmt
          fetch-depth: 0

      - name: Apply clippy fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(rel, old, new):
              p = Path(rel)
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != 1:
                  raise SystemExit("FAIL %s: expected 1 occurrence, found %d" % (rel, n))
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("patched", rel)

          patch(
              "crates/yq-nova-sdk/src/embedded.rs",
              "        let on_conflict =\n"
              "            if req.on_conflict == \"skip\" { ConflictStrategy::Skip } else { ConflictStrategy::Skip };\n",
              "        let on_conflict = ConflictStrategy::Skip;\n",
          )

          patch(
              "crates/yq-nova-server/src/http/auth.rs",
              "        .and_then(|v| {\n"
              "            let trimmed = v.trim();\n"
              "            if let Some(rest) = trimmed.strip_prefix(\"Bearer \") {\n"
              "                Some(rest.trim())\n"
              "            } else if let Some(rest) = trimmed.strip_prefix(\"bearer \") {\n"
              "                Some(rest.trim())\n"
              "            } else {\n"
              "                Some(trimmed)\n"
              "            }\n"
              "        })\n",
              "        .map(|v| {\n"
              "            let trimmed = v.trim();\n"
              "            if let Some(rest) = trimmed.strip_prefix(\"Bearer \") {\n"
              "                rest.trim()\n"
              "            } else if let Some(rest) = trimmed.strip_prefix(\"bearer \") {\n"
              "                rest.trim()\n"
              "            } else {\n"
              "                trimmed\n"
              "            }\n"
              "        })\n",
          )

          patch(
              "crates/yq-nova-server/src/http/memory.rs",
              "#[derive(Debug, Clone, Deserialize, Serialize)]\n"
              "#[serde(default)]\n"
              "pub struct UpdateMemoryRequest {",
              "#[derive(Debug, Clone, Default, Deserialize, Serialize)]\n"
              "#[serde(default)]\n"
              "pub struct UpdateMemoryRequest {",
          )

          patch(
              "crates/yq-nova-server/src/http/memory.rs",
              "impl Default for UpdateMemoryRequest {\n"
              "    fn default() -> Self {\n"
              "        Self {\n"
              "            content: None,\n"
              "            importance: None,\n"
              "            metadata: None,\n"
              "            tags: None,\n"
              "            expires_at: None,\n"
              "        }\n"
              "    }\n"
              "}\n"
              "\n",
              "",
          )

          print("all patches applied")
          PY

      - name: Commit and push to chore/rustfmt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(clippy): resolve if_same_then_else / and_then / derivable_impls warnings"
          git push origin HEAD:chore/rustfmt
