name: fixmerge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rustfmt
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/yq-nova-core/src/memory/ops_merge.rs")
          L = p.read_text(encoding="utf-8").split(chr(10))
          i = L.index('        (0..merged_uuids_strs.len()).map(|i| format!("?{}", i + 1)).collect();')
          L[i] = '        (0..merged_uuids_strs.len()).map(|i| format!("?{}", i + 2)).collect();'
          j = L.index('        "UPDATE relations SET memory_uuid = ?{} WHERE memory_uuid IN ({})",')
          L[j] = '        "UPDATE relations SET memory_uuid = ?1 WHERE memory_uuid IN ({})",'
          assert L[j + 1] == '        merged_uuids_strs.len() + 1,'
          del L[j + 1]
          k = L.index('    async fn basic_merge_keeps_earliest_created_at() {')
          m = L.index('        let out = svc', k)
          assert m - k < 40
          L[m:m] = [
              '        // `created_at` has second precision (`Utc::now().timestamp()`), so two records',
              '        // created within the same second tie and the implementation then falls back to',
              '        // `importance`. Space the timestamps out explicitly so this case only exercises',
              '        // the "keep the earliest created_at" rule.',
              '        let base_ts: i64 = sqlx::query_scalar("SELECT MIN(created_at) FROM memory_items")',
              '            .fetch_one(&svc.database.pool)',
              '            .await',
              '            .unwrap();',
              '        for (uuid, offset) in [(a.uuid, 0_i64), (b.uuid, 60_i64)] {',
              '            sqlx::query("UPDATE memory_items SET created_at = ?1 WHERE uuid = ?2")',
              '                .bind(base_ts + offset)',
              '                .bind(uuid.to_string())',
              '                .execute(&svc.database.pool)',
              '                .await',
              '                .unwrap();',
              '        }',
              '',
          ]
          p.write_text(chr(10).join(L), encoding="utf-8")
          print("patched ops_merge.rs")
          PY
      - run: cargo +nightly fmt --all
      - name: push
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "fix(core): correct relation remap SQL binding and make merge test deterministic"
          git push origin HEAD:chore/rustfmt

























































