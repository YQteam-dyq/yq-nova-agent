name: apply-rustfmt

# Manual trigger: click "Run workflow" on the Actions page of the repository.
# It runs cargo + nightly fmt and opens a pull request against main with the formatting result.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply formatting
        run: cargo +nightly fmt --all
      - name: Commit and push to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/rustfmt"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: apply nightly rustfmt"
          git push -u origin "$BRANCH" --force
      - name: Open or update pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/rustfmt"
          if gh pr view "$BRANCH" --json number --jq '.number' >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "style: apply nightly rustfmt" \
              --body "Generated by the apply-rustfmt workflow: the result of cargo + nightly fmt --all."
          fi
