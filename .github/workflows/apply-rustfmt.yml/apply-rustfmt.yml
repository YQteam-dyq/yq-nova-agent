name: apply-rustfmt

# 手动触发：在仓库的 Actions 页面点击 "Run workflow"，
# 自动执行 cargo +nightly fmt，并把格式化结果以 PR 形式提交到 main。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply formatting
        run: cargo +nightly fmt --all
      - name: Commit and push to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]" 
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/rustfmt"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: apply nightly rustfmt"
          git push -u origin "$BRANCH" --force
      - name: Open or update pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/rustfmt"
          if gh pr view "$BRANCH" --json number --jq '.number' >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH"
          else
            gh pr create --base main --head "$BRANCH" --title "style: apply nightly rustfmt" --body "由 apply-rustfmt 工作流自动生成：cargo +nightly fmt --all 的格式化结果。"
          fi
